services:
  # Service for running the pipeline scripts
  pipeline:
    build: .
    env_file: .env
    environment:
      - PYTHONPATH=/app
    volumes:
      - .:/app
    # Default command - run the interactive CLI
    command: bash scripts/cli.sh
    stdin_open: true
    tty: true

  # Service for running the FastAPI backend
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file: .env
    environment:
      - PYTHONPATH=/app
    ports:
      - "8000:8000"
    # The API service doesn't need volume mounts for production deployment
    # For local development, you can uncomment the following line:
    # volumes:
    #   - .:/app
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload