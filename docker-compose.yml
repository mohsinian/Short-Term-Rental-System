services:
  # Service for running the pipeline scripts (local development only)
  # This service is NOT deployed to cloud - only used locally for data processing
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      - PYTHONPATH=/app
    volumes:
      - .:/app
    # Default command - run the interactive CLI
    command: bash scripts/cli.sh
    stdin_open: true
    tty: true
    restart: "no"

  # Service for running the FastAPI backend
  # This service IS deployed to cloud for production API
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file: .env
    environment:
      - PYTHONPATH=/app
    ports:
      - "8000:8000"
    # Production: No volume mounts, no reload flag
    # For local development with hot reload, uncomment the following:
    # volumes:
    #   - .:/app
    # command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s